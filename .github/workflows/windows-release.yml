# Windows-only packaging and release workflow
# Electron Builder creates the installer locally; the release action publishes it.
name: Windows Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        run: npm install

      - name: Build Windows installer
        shell: pwsh
        run: npm run dist -- --publish never

      - name: Verify packaged runtime files
        shell: pwsh
        run: |
          if (-not (Test-Path "node_modules/three/build/three.module.js")) {
            Write-Error "Three.js runtime module is missing from node_modules."
            exit 1
          }
          if (-not (Test-Path "node_modules/three/examples/jsm/loaders/GLTFLoader.js")) {
            Write-Error "Three.js GLTFLoader is missing from node_modules."
            exit 1
          }
          if (-not (Test-Path "node_modules/electron-builder")) {
            Write-Error "electron-builder is missing from node_modules."
            exit 1
          }
          $asar = "dist/win-unpacked/resources/app.asar"
          if (-not (Test-Path $asar)) {
            Write-Error "Packaged app.asar was not produced."
            exit 1
          }
          $extract = "$env:TEMP/app-asar-extracted"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          npx --yes @electron/asar extract "$asar" "$extract"
          $required = @(
            "src/renderer/avatar.js",
            "src/renderer/avatar.html",
            "src/renderer/studio.js",
            "src/renderer/studio.html",
            "src/shared/character.js",
            "node_modules/three/build/three.module.js",
            "node_modules/three/examples/jsm/loaders/GLTFLoader.js"
          )
          foreach ($item in $required) {
            $path = Join-Path $extract ($item -replace '/', '\\')
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              Write-Error "Missing from extracted app.asar: $item"
              exit 1
            }
            Write-Host "ASAR OK: $item"
          }
            Write-Host "ASAR OK: $item"
          }

      - name: Verify installer
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -File -Filter *.exe -ErrorAction SilentlyContinue
          if (-not $files) {
            Write-Error "No Windows .exe installer was produced."
            exit 1
          }
          $files | ForEach-Object { Write-Host "FOUND: $($_.FullName) ($($_.Length) bytes)" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Avatar Agent v0.1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
