# Windows-only packaging and release workflow
# Main commits build and verify the installer; publishing is manual and versioned.
name: Saeed Windows Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to publish, for example 0.7.1"
        required: true
        type: string

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('saeed-release-{0}', github.ref) || format('saeed-build-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: pwsh
        run: npm install --no-audit --no-fund

      - name: Set release version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Release version must be semantic MAJOR.MINOR.PATCH, for example 0.7.1."
            exit 1
          }
          $currentVersion = [version]((Get-Content package.json -Raw | ConvertFrom-Json).version)
          $requestedVersion = [version]$env:RELEASE_VERSION
          if ($requestedVersion -le $currentVersion) {
            Write-Error "Release version must be greater than the current package version $currentVersion."
            exit 1
          }
          npm version $env:RELEASE_VERSION --no-git-tag-version

      - name: Build Windows installer
        shell: pwsh
        run: npm run dist -- --publish never

      - name: Generate updater metadata
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $installer = Get-ChildItem -Path dist -File -Filter *.exe | Where-Object { $_.Name -notlike '__uninstaller*' } | Select-Object -First 1
          if (-not $installer) { Write-Error 'Cannot generate update metadata: installer not found.'; exit 1 }
          $sha = [System.Security.Cryptography.SHA512]::Create()
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try { $hash = [Convert]::ToBase64String($sha.ComputeHash($stream)) } finally { $stream.Dispose(); $sha.Dispose() }
          $releaseDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ')
          $metadata = @(
            "version: $($package.version)"
            "files:"
            "  - url: `"$($installer.Name)`""
            "    sha512: $hash"
            "    size: $($installer.Length)"
            "path: `"$($installer.Name)`""
            "sha512: $hash"
            "releaseDate: '$releaseDate'"
          ) -join "`n"
          Set-Content -Path 'dist/latest.yml' -Value $metadata -Encoding utf8NoBOM

      - name: Verify packaged runtime files
        shell: pwsh
        run: |
          if (-not (Test-Path "src/vendor/three/three.module.js")) {
            Write-Error "Vendored Three.js runtime module was not generated."
            exit 1
          }
          if (-not (Test-Path "src/vendor/three/addons/loaders/GLTFLoader.js")) {
            Write-Error "Vendored Three.js GLTFLoader was not generated."
            exit 1
          }
          if (-not (Test-Path "src/vendor/three/addons/exporters/GLTFExporter.js")) {
            Write-Error "Vendored Three.js GLTFExporter was not generated."
            exit 1
          }
          if (-not (Test-Path "node_modules/electron-builder")) {
            Write-Error "electron-builder is missing from node_modules."
            exit 1
          }
          $asar = "dist/win-unpacked/resources/app.asar"
          if (-not (Test-Path $asar)) {
            Write-Error "Packaged app.asar was not produced."
            exit 1
          }
          $extract = "$env:TEMP/app-asar-extracted"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          npx --yes @electron/asar extract "$asar" "$extract"
          $required = @(
            "src/renderer/avatar.js",
            "src/renderer/avatar.html",
            "src/renderer/studio.js",
            "src/renderer/studio.html",
            "src/shared/character.js",
            "src/vendor/three/three.module.js",
            "src/vendor/three/addons/loaders/GLTFLoader.js",
            "src/vendor/three/addons/exporters/GLTFExporter.js"
          )
          foreach ($item in $required) {
            $path = Join-Path $extract ($item -replace '/', '\')
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              Write-Error "Missing from extracted app.asar: $item"
              exit 1
            }
            Write-Host "ASAR OK: $item"
          }

      - name: Verify installer and updater metadata
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path dist -File -Filter *.exe -ErrorAction SilentlyContinue | Where-Object { $_.Name -notlike '__uninstaller*' }
          if (-not $files) {
            Write-Error "No Windows installer .exe was produced."
            exit 1
          }
          if (-not ($files.Name -match '^Saeed Setup ')) {
            Write-Error "Installer is not branded Saeed. Found: $($files.Name -join ', ')"
            exit 1
          }
          $files | ForEach-Object { Write-Host "FOUND INSTALLER: $($_.FullName) ($($_.Length) bytes)" }
          if (-not (Test-Path "dist/latest.yml")) {
            Write-Error "electron-updater metadata latest.yml was not produced."
            exit 1
          }
          $expectedVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $manifest = Get-Content "dist/latest.yml" -Raw
          if ($manifest -notmatch "(?m)^version:\s*$([regex]::Escape($expectedVersion))\s*$") {
            Write-Error "Updater metadata version does not match package.json version $expectedVersion."
            exit 1
          }
          if ($manifest -notlike "*$($files[0].Name)*") {
            Write-Error "Updater metadata does not reference the built installer."
            exit 1
          }

      - name: Upload verified Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Saeed-Windows-Installer-${{ github.sha }}
          path: |
            dist/Saeed Setup *.exe
            dist/Saeed Setup *.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Saeed v${{ inputs.version }}
          generate_release_notes: true
          files: |
            dist/Saeed Setup ${{ inputs.version }}.exe
            dist/Saeed Setup ${{ inputs.version }}.exe.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
