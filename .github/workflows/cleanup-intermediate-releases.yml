name: Cleanup accidental intermediate releases

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: contains(github.event.head_commit.message, 'Cleanup accidental development releases')
    runs-on: ubuntu-latest
    steps:
      - name: Remove releases created by development commits
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tags = ['v0.1.41', 'v0.1.42', 'v0.1.43', 'v0.1.44', 'v0.1.45', 'v0.1.46', 'v0.1.47', 'v0.1.48'];
            for (const tag of tags) {
              try {
                const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
                await github.rest.repos.deleteRelease({ owner, repo, release_id: data.id });
                core.info('Deleted release ' + tag);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info('Release not found: ' + tag);
              }
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: 'tags/' + tag });
                core.info('Deleted tag ' + tag);
              } catch (error) {
                if (error.status !== 404) throw error;
                core.info('Tag not found: ' + tag);
              }
            }
