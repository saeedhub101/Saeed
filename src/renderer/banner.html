<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Saeed is working</title>
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px "Segoe UI", system-ui, sans-serif; user-select: none; }
    #bar { height: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 8px 0 16px; background: #c62828; color: #fff; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
    #dot { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: p 1.2s ease-in-out infinite; }
    @keyframes p { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { #dot { animation: none; } }
    #t { flex: 1; font-weight: 600; }
    #t small { font-weight: 400; opacity: .85; margin-left: 6px; }
    button { border: 0; border-radius: 6px; background: #fff; color: #c62828; font: inherit; font-weight: 700; padding: 6px 16px; cursor: pointer; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="bar"><span id="dot"></span><span id="t">Saeed is controlling this PC<small>Ctrl+Alt+X to stop</small></span><button id="stop">STOP</button></div>
  <script>document.getElementById('stop').onclick = () => window.api.bannerStop();</script>
</body>
</html>
