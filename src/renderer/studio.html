<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Avatar Studio</title>
  <link rel="stylesheet" href="studio.css">
  <script>
    function showError(m) {
      var d = document.getElementById('err');
      if (!d) { d = document.createElement('pre'); d.id = 'err'; d.style.cssText = 'position:fixed;left:6px;right:6px;top:6px;margin:0;padding:8px;background:#5a1414;color:#fff;font:12px Consolas,monospace;z-index:99;white-space:pre-wrap;max-height:50%;overflow:auto;user-select:text'; document.body.appendChild(d); }
      d.textContent += m + '\n';
    }
    addEventListener('error', function (e) { showError(e.message || ('Could not load ' + (e.target && (e.target.src || e.target.href)))); }, true);
    addEventListener('unhandledrejection', function (e) { showError(String(e.reason && e.reason.stack || e.reason)); });
  </script>
  <script type="importmap">
    { "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/addons/" } }
  </script>
</head>
<body>
  <header id="top">
    <strong class="title">Avatar Studio</strong>
    <button id="btnModel" class="btn">Change character…</button>
    <label class="field">Model faces
      <select id="yaw"><option value="0">the camera (+Z)</option><option value="180">away (−Z)</option></select>
    </label>
    <label class="chk"><input type="checkbox" id="chkSkel" checked> Show skeleton</label>
    <span id="status" class="muted"></span>
  </header>
  <main>
    <section id="view"><canvas id="c"></canvas></section>
    <aside>
      <nav id="tabs"></nav>
      <div id="panel"></div>
    </aside>
  </main>
  <div id="toast" hidden></div>
  <script type="module" src="studio.js"></script>
</body>
</html>
